<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ЗБД Змейка</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent; 
      font-family: 'Courier New', Courier, monospace;
    }
    #main-layout {
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 4px double #00ff00;
      padding: 15px;
      width: 650px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #game-side {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #player-name-display {
      color: #00ff00;
      font-size: 14px;
      margin-bottom: 5px;
      text-align: center;
    }
    #nickname-input {
      background: #111;
      border: 2px solid #00ff00;
      color: #00ff00;
      font-family: monospace;
      font-size: 16px;
      width: 50px;
      text-align: center;
      text-transform: uppercase;
      margin-left: 5px;
      outline: none;
    }
    #score {
      color: #00ff00;
      font-size: 20px;
      margin-bottom: 10px;
      text-shadow: 0 0 5px #00ff00;
    }
    canvas {
      background: #111;
      border: 2px solid #00ff00;
    }
    #leaderboard-side {
      flex: 1;
      color: #00ff00;
      border-left: 2px dashed #00ff00;
      padding-left: 15px;
    }
    h3 {
      margin-top: 0;
      text-shadow: 0 0 5px #00ff00;
      text-align: center;
    }
    ol {
      padding-left: 25px;
      margin: 0;
    }
    li {
      margin-bottom: 8px;
      font-size: 16px;
    }
    .score-val {
      float: right;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="main-layout">
  <div id="game-side">
    <div id="player-name-display">
      <label for="nickname-input">ENTER NAME (3 CHARS):</label>
      <input type="text" id="nickname-input" maxlength="3" placeholder="AAA">
    </div>
    <div id="score">SCORE: 0</div>
    <canvas id="gc" width="400" height="400"></canvas>
  </div>
  
  <div id="leaderboard-side">
    <h3>TOP PLAYERS</h3>
    <ol id="leader-list">
      <li>Загрузка...</li>
    </ol>
  </div>
</div>

<script>
// --- НАСТРОЙКА GOOGLE ---
const GOOGLE_FORM_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLScBkRdQ3YUohrALZ4v2jxinPSn6vSTCYtJechM__vKqNTFPpQ/formResponse";
const NAME_ENTRY_ID = "entry.918646997";
const SCORE_ENTRY_ID = "entry.60603237";

// ВАШ URL ВЕБ-ПРИЛОЖЕНИЯ
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNYi7G8HwuaS8xmDpK2OzVT2lcVBzUa-icXbQokqDFo7uD3kjqvYFN2ech9n6DKEDgjw/exec";
// ----------------------------------------------------

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');
const nameInput = document.getElementById('nickname-input');

nameInput.focus();

let posX = posY = 10;
let gridSize = tileCount = 20;
let appleX = appleY = 15;
let xv = yv = 0;
let trail = [];
let tail = 5;
let score = 0;
let isGameOver = false;

setInterval(game, 1000 / 15);
document.addEventListener("keydown", keyPush);

console.log("Загрузка таблицы лидеров при запуске...");
loadLeaderboard();

function game() {
    if (isGameOver) return;

    posX += xv;
    posY += yv;
    
    if (posX < 0) posX = tileCount - 1;
    if (posX > tileCount - 1) posX = 0;
    if (posY < 0) posY = tileCount - 1;
    if (posY > tileCount - 1) posY = 0;

    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff00";
    for (let i = 0; i < trail.length; i++) {
        ctx.fillRect(trail[i].x * gridSize, trail[i].y * gridSize, gridSize - 2, gridSize - 2);
        if (trail[i].x === posX && trail[i].y === posY) {
            if (xv !== 0 || yv !== 0) { 
                gameOver();
            }
        }
    }

    trail.push({ x: posX, y: posY });
    while (trail.length > tail) {
        trail.shift();
    }

    if (appleX === posX && appleY === posY) {
        tail++;
        score += 10;
        scoreDiv.innerText = "SCORE: " + score;
        appleX = Math.floor(Math.random() * tileCount);
        appleY = Math.floor(Math.random() * tileCount);
    }

    ctx.fillStyle = "#ff0000";
    ctx.fillRect(appleX * gridSize, appleY * gridSize, gridSize - 2, gridSize - 2);
}

function gameOver() {
    isGameOver = true;
    xv = yv = 0;
    
    let finalName = nameInput.value.trim().toUpperCase();
    if (finalName.length === 0) finalName = "ZBD";
    
    alert("Игра окончена! Ваш счет: " + score + ". Отправляем рекорд...");
    sendRecord(finalName, score);
}

function keyPush(evt) {
    if (document.activeElement === nameInput && evt.keyCode !== 13) {
        return; 
    }

    if ([32, 83, 37, 38, 39, 40].includes(evt.keyCode)) {
        evt.preventDefault();
    }

    if (isGameOver && evt.keyCode === 32) {
        posX = posY = 10; tail = 5; score = 0; isGameOver = false;
        scoreDiv.innerText = "SCORE: 0";
        nameInput.focus();
        return;
    }

    switch (evt.keyCode) {
        case 65: if (xv !== 1)  { xv = -1; yv = 0;  nameInput.blur(); } break;
        case 87: if (yv !== 1)  { xv = 0;  yv = -1; nameInput.blur(); } break;
        case 68: if (xv !== -1) { xv = 1;  yv = 0;  nameInput.blur(); } break;
        case 83: if (yv !== -1) { xv = 0;  yv = 1;  nameInput.blur(); } break;
    }
}

function sendRecord(name, score) {
    const formData = new FormData();
    formData.append(NAME_ENTRY_ID, name);
    formData.append(SCORE_ENTRY_ID, score);

    fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
    }).then(() => {
        console.log("Рекорд отправлен в форму");
        setTimeout(() => {
            console.log("Обновляем таблицу лидеров после отправки рекорда...");
            loadLeaderboard();
        }, 2000);
        alert("Рекорд сохранен! Нажмите ПРОБЕЛ, чтобы играть снова.");
    }).catch(err => {
        console.error("Ошибка отправки:", err);
        alert("Ошибка отправки рекорда. Проверьте соединение.");
    });
}

// ✅ ЗАГРУЗКА С ИСПОЛЬЗОВАНИЕМ JSONP (обход CORS)
function loadLeaderboard() {
    const listHtml = document.getElementById('leader-list');
    listHtml.innerHTML = "<li>⏳ Загрузка...</li>";
    
    // Создаем уникальное имя для callback функции
    const callbackName = 'jsonp_callback_' + Date.now();
    
    // Определяем функцию callback в глобальной области
    window[callbackName] = function(data) {
        console.log("Данные получены через JSONP:", data);
        listHtml.innerHTML = "";
        
        if (!data || data.length === 0) {
            listHtml.innerHTML = "<li>📭 Таблица пуста</li>";
        } else {
            const topPlayers = data.slice(0, 10);
            topPlayers.forEach((p, index) => {
                const medal = index === 0 ? "🏆 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "";
                listHtml.innerHTML += `<li>${medal}${p.name} <span class="score-val">${p.score}</span></li>`;
            });
        }
        
        // Удаляем callback после использования
        delete window[callbackName];
        // Удаляем скрипт
        if (scriptElement) {
            document.body.removeChild(scriptElement);
        }
    };
    
    // Создаем script элемент для JSONP запроса
    const scriptElement = document.createElement('script');
    scriptElement.src = APPS_SCRIPT_URL + '?callback=' + callbackName;
    scriptElement.onerror = function() {
        listHtml.innerHTML = "<li>❌ Ошибка загрузки</li>";
        console.error("Ошибка загрузки JSONP");
        delete window[callbackName];
        if (scriptElement) {
            document.body.removeChild(scriptElement);
        }
    };
    
    document.body.appendChild(scriptElement);
}

</script>

</body>
</html>
